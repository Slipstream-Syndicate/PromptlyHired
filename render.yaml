# Render blueprint: API + Postgres + the two scheduled jobs.
#
# Deploy with: Render dashboard -> New -> Blueprint -> point at this repo.
# Everything marked `sync: false` is a secret you fill in once in the dashboard;
# it is deliberately NOT committed.
#
# The frontend is NOT here - it goes to Netlify (see netlify.toml).

databases:
  - name: jobtrail-db
    databaseName: jobtrail
    user: jobtrail
    plan: free

services:
  - type: web
    name: jobtrail-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: ./start.sh
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Render injects this as postgres:// - app/config.py rewrites the scheme.
      - key: DATABASE_URL
        fromDatabase:
          name: jobtrail-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Must be your real Netlify URL, https, comma-separated for several.
      - key: CORS_ORIGINS
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: JOB_COUNTRY
        value: uk
      - key: RAPIDAPI_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Profile pictures must not live on the container filesystem - Render
      # wipes it on every deploy. Point these at Cloudflare R2.
      - key: MEDIA_STORAGE
        value: s3
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false

  # Weekly, not daily: each run costs one JSearch call per followed company,
  # against a ~200 call/month free plan. Sundays 07:00 UTC.
  - type: cron
    name: jobtrail-digest
    runtime: python
    plan: free
    rootDir: backend
    schedule: "0 7 * * 0"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.tasks digest
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jobtrail-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: JOB_COUNTRY
        value: uk
      - key: RAPIDAPI_KEY
        sync: false
      - key: DIGEST_MAX_COMPANIES
        value: "5"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false

  # Costs no API quota - reads stored applications only. Mondays 08:00 UTC.
  - type: cron
    name: jobtrail-reminders
    runtime: python
    plan: free
    rootDir: backend
    schedule: "0 8 * * 1"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.tasks reminders
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jobtrail-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: FOLLOW_UP_AFTER_DAYS
        value: "14"
      - key: REMINDER_REPEAT_DAYS
        value: "7"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
