# Render blueprint: API + Postgres.
#
# Deploy with: Render dashboard -> New -> Blueprint -> point at this repo.
# Everything marked `sync: false` is a secret you fill in once in the dashboard;
# it is deliberately NOT committed.
#
# The frontend is NOT here - it goes to Netlify (see netlify.toml).

databases:
  - name: jobtrail-db
    databaseName: jobtrail
    user: jobtrail
    plan: free

services:
  - type: web
    name: jobtrail-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: ./start.sh
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Render injects this as postgres:// - app/config.py rewrites the scheme.
      - key: DATABASE_URL
        fromDatabase:
          name: jobtrail-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Must be your real Netlify URL, https, comma-separated for several.
      - key: CORS_ORIGINS
        sync: false
      - key: APP_BASE_URL
        sync: false
      # The core of the product. Free key: https://aistudio.google.com/apikey
      - key: GEMINI_API_KEY
        sync: false
      # Resumes and profile pictures must not live on the container
      # filesystem - Render wipes it on every deploy. Point these at R2.
      - key: MEDIA_STORAGE
        value: s3
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
