services:
  db:
    image: postgres:16-alpine
    container_name: jobtrail-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobtrail
      POSTGRES_PASSWORD: jobtrail
      POSTGRES_DB: jobtrail
    ports:
      - "5433:5432"
    volumes:
      - jobtrail_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtrail -d jobtrail"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jobtrail_pgdata:
