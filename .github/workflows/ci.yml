name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    # Tests run against real Postgres, not SQLite: the schema uses native enums
    # and server-side defaults that SQLite would not exercise.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobtrail
          POSTGRES_PASSWORD: jobtrail
          POSTGRES_DB: jobtrail
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U jobtrail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check migrations have a single head
        run: |
          heads=$(python -m alembic heads | grep -c '(head)')
          test "$heads" -eq 1 || { echo "Expected 1 migration head, found $heads"; exit 1; }
        env:
          DATABASE_URL: postgresql+psycopg://jobtrail:jobtrail@localhost:5433/jobtrail

      - name: Migrations apply to an empty database
        run: python -m alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://jobtrail:jobtrail@localhost:5433/jobtrail

      - name: Run tests
        run: python -m pytest
        env:
          TEST_ADMIN_DATABASE_URL: postgresql+psycopg://jobtrail:jobtrail@localhost:5433/postgres
          JWT_SECRET: ci-secret-not-used-in-production-abcdefghijkl

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build (also generates the service worker)
        run: npm run build

      - name: Service worker and manifest were emitted
        run: |
          test -f dist/sw.js || { echo "sw.js missing - PWA would not install"; exit 1; }
          test -f dist/manifest.webmanifest || { echo "manifest missing"; exit 1; }

  spec-audit:
    name: CLAUDE.md compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/audit_spec.py
